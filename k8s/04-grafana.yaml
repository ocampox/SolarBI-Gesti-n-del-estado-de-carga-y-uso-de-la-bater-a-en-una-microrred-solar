# Deployment: sin estado (todo se provisiona desde ConfigMaps), por eso puede reiniciarse o escalar.
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec: {type: NodePort, selector: {app: grafana}, ports: [{port: 3000, nodePort: 30300}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports: [{containerPort: 3000}]
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: solar-config, key: POSTGRES_DB}}}
            - {name: POSTGRES_HOST, valueFrom: {configMapKeyRef: {name: solar-config, key: POSTGRES_HOST}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: solar-secret, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: solar-secret, key: POSTGRES_PASSWORD}}}
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: solar-secret, key: GF_SECURITY_ADMIN_USER}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: solar-secret, key: GF_SECURITY_ADMIN_PASSWORD}}}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          volumeMounts:
            - {name: ds, mountPath: /etc/grafana/provisioning/datasources}
            - {name: prov, mountPath: /etc/grafana/provisioning/dashboards/provider.yml, subPath: provider.yml}
            - {name: prov, mountPath: /etc/grafana/provisioning/alerting/rules.yml, subPath: rules.yml}
            - {name: dash, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: ds, configMap: {name: grafana-ds}}
        - {name: prov, configMap: {name: grafana-prov}}
        - {name: dash, configMap: {name: grafana-dash}}
